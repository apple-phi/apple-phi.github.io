# yaml-language-server: $schema=https://posit-dev.github.io/brand-yml/schema/brand.schema.json
# Shared brand reference; consumed by Quarto, while Astro retains its own styles.

meta:
  name: Lucas Ng
  description: 'Lucas Ng: research, publications, and news.'
  link:
    home: https://apple-phi.github.io/
    github: https://github.com/apple-phi
    linkedin: https://www.linkedin.com/in/lucas-ng123/
    scholar: https://scholar.google.com/citations?user=YUVlBmsAAAAJ
    email: mailto:ln373@cantab.ac.uk

# No logo asset: the site uses the name as a text wordmark.
color:
  palette:
    white: '#ffffff'
    charcoal: '#1c1c1c'
    ink: 'rgba(0, 0, 0, 0.85)'
    muted: 'rgba(0, 0, 0, 0.4)'
    faint: 'rgba(0, 0, 0, 0.24)'
    chalk: 'rgba(255, 255, 255, 0.9)'
    muted-on-dark: 'rgba(255, 255, 255, 0.4)'
    faint-on-dark: 'rgba(255, 255, 255, 0.24)'
    highlight: '#f3ffc4'
    highlight-on-dark: '#545b37'
  background: white
  foreground: ink
  primary: ink
  secondary: muted
  tertiary: faint
  light: white
  dark: charcoal

typography:
  fonts:
    - family: Sohne
      source: file
      files:
        - path: public/fonts/Sohne-Buch.woff2
          weight: 400
          style: normal
        - path: public/fonts/Sohne-Kraftig.woff2
          weight: 500
          style: normal
        - path: public/fonts/Sohne-Halbfett.woff2
          weight: 600
          style: normal
        - path: public/fonts/Sohne-Dreiviertelfett.woff2
          weight: 700
          style: normal
    - family: Newsreader
      source: file
      files:
        - path: public/fonts/Newsreader-Italic.woff2
          style: italic
          weight: 400
    - family: SF Mono
      source: system
  base:
    family: Sohne
    size: 16px
    weight: 400
    line-height: 1.75
  headings:
    family: Sohne
    weight: 500
    color: foreground
    line-height: 1.75
  monospace:
    family: SF Mono
    size: 0.9em
  link:
    color: foreground
    decoration: underline

# Context-specific tokens, outside the standard typography roles.
# These document Chiri's choices; other consumers must opt into them.
defaults:
  chiri:
    wordmark: LUCAS NG
    content-width: 35rem
    heading-size: 16px
    small-text-size: 14px
    letter-spacing: -0.02em
    font-feature-settings: '"ss03" 1'
    emphasis:
      family: Newsreader
      size: calc(1em + 1px)
      style: italic
      weight: 400
      dark-color: white
    monospace-fallbacks: [SFMono-Regular, ui-monospace, monospace]
    dark:
      background: '#1c1c1c'
      foreground: 'rgba(255, 255, 255, 0.9)'
      primary: 'rgba(255, 255, 255, 0.9)'
      secondary: 'rgba(255, 255, 255, 0.4)'
      tertiary: 'rgba(255, 255, 255, 0.24)'
